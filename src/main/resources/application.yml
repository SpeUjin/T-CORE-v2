spring:
  application:
    name: t-core-v2

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mariadb://localhost:3306/t_core
    username: t_core_user
    password: pass
    driver-class-name: org.mariadb.jdbc.Driver

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # JPA 및 데이터베이스 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      # 🚨 절대 이곳에 "sk-..." 형태의 키를 직접 적지 마세요! (GitHub 해킹 타겟이 됩니다)
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # 비용 효율적이고 빠른 응답을 위해 gpt-4o-mini 또는 gpt-3.5-turbo를 추천합니다.
          model: gpt-4o-mini
          # ⭐️ 엔지니어링 포인트: temperature를 낮게(0.0~0.2) 설정합니다.
          # 인프라를 제어하는 AI는 창의적인 답변(소설 쓰기)보다, 프롬프트 규칙을 엄격하게 따르는 '정확도'가 생명이기 때문입니다.
          temperature: 0.1